<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FinLingvo — Лига</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .league-tabs { display:flex;gap:0.45rem;overflow-x:auto;padding:0.85rem 1.2rem;background:var(--card);border-bottom:1px solid rgba(255,255,255,0.06); }
    .l-tab { padding:0.42rem 0.85rem;border-radius:99px;font-size:0.78rem;font-weight:800;cursor:pointer;white-space:nowrap;border:1.5px solid rgba(255,255,255,0.08);background:var(--card2);color:#7a859e;transition:all 0.2s;font-family:'Nunito',sans-serif; }
    .l-tab.active { color:white; }
    .podium-wrap { display:flex;align-items:flex-end;justify-content:center;gap:0.8rem;padding:1.5rem 1rem 0.5rem; }
    .podium-item { display:flex;flex-direction:column;align-items:center;gap:0.4rem; }
    .pod-ava { border-radius:50%;background:linear-gradient(145deg,#162240,#0b1628);display:flex;align-items:center;justify-content:center; }
    .pod-base { border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;width:80px; }
    .zone-lbl { font-size:0.62rem;font-weight:900;letter-spacing:2.5px;padding:0.4rem 0.8rem;text-transform:uppercase; }
  </style>
</head>
<body>
<div class="app-layout">

  <div class="mob-overlay" id="mob-overlay" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <a href="learn.html" class="sidebar-logo" style="text-decoration:none;">
      <div class="sidebar-logo-icon">🦅</div>
      <div><div class="sidebar-logo-title">FinLingo</div><div class="sidebar-logo-sub">Финансылык саббатулук оюну</div></div>
    </a>
    <nav style="flex:1;">
      <a href="learn.html"       class="nav-item"><span class="nav-icon">📚</span>Үйрөнүү</a>
      <a href="leaderboard.html" class="nav-item active"><span class="nav-icon" style="font-size:0.95rem;">📊</span>Лига</a>
      <a href="shop.html"        class="nav-item"><span class="nav-icon">🛒</span>Дүкөн</a>
      <a href="profile.html"     class="nav-item"><span class="nav-icon">👤</span>Профиль</a>
      <a href="settings.html"    class="nav-item"><span class="nav-icon">⚙️</span>Орнотуу</a>
    </nav>
    <div id="sidebar-user" style="padding:0.6rem;border-top:1px solid rgba(255,255,255,0.06);"></div>
  </aside>

  <div class="main-content">
    <div class="top-stats">
      <button class="hamburger" onclick="openSidebar()">☰</button>
      <div style="flex:1;"></div>
      <div class="stat-pill streak">🔥 <span id="stat-streak">0</span></div>
      <div class="stat-pill gems">💎 <span id="stat-gems">0</span></div>
      <div class="stat-pill hearts">❤️ <span id="stat-hearts">5</span></div>
    </div>

    <!-- League tabs -->
    <div class="league-tabs" id="l-tabs"></div>

    <div class="page-wrap" style="max-width:580px;padding-top:1.5rem;">

      <!-- League header -->
      <div style="text-align:center;margin-bottom:1.5rem;animation:slide-up 0.4s ease both;">
        <div style="font-size:4rem;animation:float 3.5s ease-in-out infinite;display:block;margin-bottom:0.5rem;" id="l-icon">🥉</div>
        <h1 style="font-size:1.5rem;font-weight:900;margin-bottom:0.25rem;" id="l-name">Жез Лигасы</h1>
        <p style="color:#7a859e;font-size:0.82rem;font-weight:600;" id="l-sub">Жумалык рейтинг</p>
        <div style="display:flex;gap:1.5rem;justify-content:center;margin-top:1rem;">
          <div style="text-align:center;">
            <div style="font-size:1.6rem;font-weight:900;color:#1CB0F6;" id="my-rank">—</div>
            <div style="font-size:0.65rem;color:#3d4860;font-weight:700;">МЕНИН ОРНУМ</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:1.6rem;font-weight:900;color:#58CC02;" id="my-wxp">0</div>
            <div style="font-size:0.65rem;color:#3d4860;font-weight:700;">ЖУМАЛЫК XP</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:1.6rem;font-weight:900;color:#FF9600;" id="days-left">7</div>
            <div style="font-size:0.65rem;color:#3d4860;font-weight:700;">КҮН КАЛДЫ</div>
          </div>
        </div>
      </div>

      <!-- Podium -->
      <div class="section-card" style="margin-bottom:1.2rem;">
        <div class="section-card-hdr">🎖️ Топ 3</div>
        <div class="podium-wrap" id="podium"></div>
      </div>

      <!-- Leaderboard -->
      <div class="section-card">
        <div class="section-card-hdr">📋 Рейтинг</div>
        <div style="padding:0.75rem;" id="lb-list"></div>
      </div>

    </div>
  </div>

  <nav class="mobile-nav">
    <div class="mob-nav-items">
      <a href="learn.html"       class="mob-nav-item"><span class="ico">📚</span>Үйрөнүү</a>
      <a href="leaderboard.html" class="mob-nav-item active"><span class="ico">🏆</span>Лига</a>
      <a href="shop.html"        class="mob-nav-item"><span class="ico">🛒</span>Дүкөн</a>
      <a href="profile.html"     class="mob-nav-item"><span class="ico">👤</span>Профиль</a>
    </div>
  </nav>

</div>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  if (!AUTH.isLoggedIn()) window.location.href = 'index.html';
  const user = AUTH.getUser();
  APP.updateHeaderStats();

  function sidebarUser() {
    const u = AUTH.getUser(), league = LEAGUES.find(l => l.id === u.league) || LEAGUES[0];
    document.getElementById('sidebar-user').innerHTML = `<div style="display:flex;align-items:center;gap:0.65rem;padding:0.5rem;"><div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#162240,#0b1628);display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:2px solid rgba(28,176,246,0.3);flex-shrink:0;">${u.avatar||'🦅'}</div><div><div style="font-weight:800;font-size:0.85rem;">${u.name}</div><div style="font-size:0.65rem;color:#7a859e;">${league.icon} ${league.name}</div></div></div>`;
  }
  sidebarUser();

  function openSidebar()  { document.getElementById('sidebar').classList.add('open'); document.getElementById('mob-overlay').classList.add('show'); }
  function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('mob-overlay').classList.remove('show'); }

  let selLeague = user.league || 'bronze';

  function renderTabs() {
    document.getElementById('l-tabs').innerHTML = LEAGUES.map(l =>
      `<button class="l-tab ${l.id===selLeague?'active':''}" onclick="pickLeague('${l.id}')"
        style="${l.id===selLeague?`background:${l.color}20;border-color:${l.color}60;color:${l.color};`:''}">
        ${l.icon} ${l.name}
      </button>`).join('');
  }

  function pickLeague(id) { selLeague = id; renderTabs(); renderLB(); }

  function renderLB() {
    const league = LEAGUES.find(l => l.id === selLeague) || LEAGUES[0];
    document.getElementById('l-icon').textContent = league.icon;
    document.getElementById('l-name').textContent = `${league.name} Лигасы`;
    document.getElementById('l-sub').textContent = 'Жумалык рейтинг · Эң жогорку 5 жогорулайт';

    const me = { name: user.name, xp: user.weeklyXP || Math.round(user.xp * 0.08) || 5, streak: user.streak, avatar: user.avatar || '🦅', isMe: true };
    let all = [...DEMO_USERS.map(u => ({...u, isMe: false})), me];
    all.sort((a, b) => b.xp - a.xp);

    const myRank = all.findIndex(u => u.isMe) + 1;
    document.getElementById('my-rank').textContent = `#${myRank}`;
    document.getElementById('my-wxp').textContent = me.xp;
    document.getElementById('days-left').textContent = Math.max(1, 7 - new Date().getDay());

    renderPodium(all.slice(0, 3));

    const list = document.getElementById('lb-list');
    list.innerHTML = `
      <div class="zone-lbl" style="color:#58CC02;">↑ ЖОГОРКУ ЗОН — КӨТӨРҮЛҮҮ</div>
      ${all.slice(0,5).map((u,i) => rowHtml(u, i+1)).join('')}
      <div class="zone-lbl" style="color:#7a859e;margin-top:0.5rem;">OPТОчу ЗОН</div>
      ${all.slice(5,8).map((u,i) => rowHtml(u, i+6)).join('')}
      <div class="zone-lbl" style="color:#FF4B4B;margin-top:0.5rem;">↓ АСТЫНКЫ ЗОН</div>
      ${all.slice(8).map((u,i) => rowHtml(u, i+9)).join('')}
    `;
  }

  function renderPodium(top3) {
    if (top3.length < 3) return;
    const order = [1,0,2];
    const h = [64,80,54];
    const size = [52,64,44];
    const medals = ['🥈','🥇','🥉'];
    document.getElementById('podium').innerHTML = order.map((ri, pi) => {
      const u = top3[ri];
      if (!u) return '';
      return `<div class="podium-item">
        <div class="pod-ava" style="width:${size[pi]}px;height:${size[pi]}px;font-size:${size[pi]*0.45}px;${ri===0?'border:3px solid #FFD700;box-shadow:0 0 20px rgba(255,215,0,0.3);':'border:2px solid rgba(255,255,255,0.1);'}">${u.avatar||'👤'}</div>
        <div style="font-size:0.72rem;font-weight:800;max-width:70px;text-align:center;">${u.name}</div>
        <div style="font-size:0.65rem;color:#7a859e;font-weight:700;">${u.xp} XP</div>
        <div class="pod-base" style="height:${h[pi]}px;">${medals[pi]}</div>
      </div>`;
    }).join('');
  }

  function rowHtml(u, rank) {
    const rk = rank <= 3 ? ['🥇','🥈','🥉'][rank-1] : `#${rank}`;
    return `<div class="leader-item ${u.isMe?'me':''} ${rank<=3?'top3':''}" style="animation:slide-up 0.3s ease both;animation-delay:${rank*0.04}s;">
      <div class="leader-rank ${rank<=3?`rank-${rank}`:''}">  ${rk}</div>
      <div class="leader-ava">${u.avatar||'👤'}</div>
      <div class="leader-name">
        ${u.name} ${u.isMe?'<span style="font-size:0.65rem;color:#1CB0F6;font-weight:800;">(Сен)</span>':''}
        <div class="leader-streak">🔥 ${u.streak} күн</div>
      </div>
      <div class="leader-xp">${u.xp.toLocaleString()} XP</div>
    </div>`;
  }

  renderTabs(); renderLB();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сабак — FinLingvo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦅</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- LESSON SCREEN -->
<div class="lesson-screen" id="lesson-screen">
  <!-- Header -->
  <div class="lesson-header">
    <div id="lesson-header-inner" class="lesson-header-inner">
      <button class="lesson-close-btn" onclick="confirmClose()">✕</button>
      <div class="lesson-progress-bar">
        <div class="lesson-progress-fill" id="progress-fill"></div>
      </div>
      <div class="hearts-display" id="hearts-display">❤️ <span id="hearts-count">5</span></div>
    </div>
  </div>

  <!-- Question Area -->
  <div class="lesson-body" id="question-area">
    <div style="display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:12px">
      <div class="spinner"></div>
      <span style="color:var(--muted);font-weight:600">Жүктөлүүдө...</span>
    </div>
  </div>

  <!-- Feedback Bar -->
  <div class="feedback-bar" id="feedback-bar" style="display:none">
    <div class="feedback-inner" id="feedback-inner">
      <div class="feedback-icon" id="feedback-icon">✅</div>
      <div class="feedback-text">
        <div class="feedback-title" id="feedback-title">Туура!</div>
        <div class="feedback-sub"   id="feedback-sub"></div>
      </div>
    </div>
    <button class="btn btn-green btn-lg" id="feedback-btn" onclick="nextQuestion()">Улантуу</button>
  </div>
</div>

<!-- NO HEARTS OVERLAY -->
<div id="overlay-screen" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;align-items:center;justify-content:center">
  <div style="background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-xl);padding:36px;max-width:360px;width:90%;text-align:center">
    <div style="font-size:3rem;margin-bottom:12px">💔</div>
    <h2 style="font-size:1.5rem;margin-bottom:8px">Жүрөктөр түгөндү!</h2>
    <p style="color:var(--muted);font-size:.9rem;margin-bottom:20px">
      Жүрөктөр автоматтык түрдө 30 мүнөттөн кийин калыбына келет.<br>Же дүкөндөн сатып ал.
    </p>
    <a href="/shop.html" class="btn btn-green btn-full btn-lg" style="margin-bottom:10px">💎 Дүкөнгө бар</a>
    <a href="/learn.html" class="btn btn-surface btn-full">← Окуу жолуна кайт</a>
  </div>
</div>

<!-- COMPLETION SCREEN -->
<div id="completion-screen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
    <div style="max-width:420px;width:100%;text-align:center">
      <div style="font-size:4rem;margin-bottom:12px;animation:bobble 1s ease infinite" id="comp-icon">🎉</div>
      <h1 style="font-size:2rem;margin-bottom:4px">Сабак аяктады!</h1>
      <p style="color:var(--muted);margin-bottom:28px" id="comp-subtitle">Жакшы иш, улантып кет!</p>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px">
        <div style="background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);padding:16px">
          <div style="font-size:1.8rem;margin-bottom:4px">⭐</div>
          <div style="font-size:1.5rem;font-weight:900;color:var(--yellow)" id="comp-xp">0</div>
          <div style="font-size:.75rem;color:var(--muted);font-weight:700">XP</div>
        </div>
        <div style="background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);padding:16px">
          <div style="font-size:1.8rem;margin-bottom:4px">🎯</div>
          <div style="font-size:1.5rem;font-weight:900;color:var(--green)" id="comp-acc">0%</div>
          <div style="font-size:.75rem;color:var(--muted);font-weight:700">Тактык</div>
        </div>
        <div style="background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);padding:16px">
          <div style="font-size:1.8rem;margin-bottom:4px">⏱️</div>
          <div style="font-size:1.5rem;font-weight:900;color:var(--blue)" id="comp-time">0с</div>
          <div style="font-size:.75rem;color:var(--muted);font-weight:700">Убакыт</div>
        </div>
      </div>

      <div style="background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:24px" id="comp-achievements" style="display:none">
        <div style="font-weight:800;margin-bottom:8px">🏆 Жаңы жетишкендиктер!</div>
        <div id="comp-achievement-list"></div>
      </div>

      <a href="/learn.html" class="btn btn-green btn-full btn-lg" style="margin-bottom:10px">→ Улантуу</a>
      <a href="/learn.html" class="btn btn-surface btn-full">Окуу жолуна кайт</a>
    </div>
  </div>
</div>

<script src="/js/data.js"></script>
<script src="/js/app.js"></script>
<script src="/js/lesson.js"></script>
<script>
function confirmClose() {
  if (confirm('Сабакты таштайсызбы? Прогресс сакталбайт.')) {
    window.location.href = '/learn.html';
  }
}
</script>
</body>
</html>

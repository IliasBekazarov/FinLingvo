<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кирүү / Каттоо — FinLingvo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦅</text></svg>">
<link rel="stylesheet" href="/css/style.css">
<style>
.auth-page{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.auth-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.auth-bg::before{content:'';position:absolute;top:-30%;left:-20%;width:60%;height:60%;background:radial-gradient(circle,rgba(88,204,2,.08) 0%,transparent 70%)}
.auth-bg::after{content:'';position:absolute;bottom:-20%;right:-10%;width:50%;height:50%;background:radial-gradient(circle,rgba(28,176,246,.06) 0%,transparent 70%)}
.auth-header{position:relative;z-index:1;padding:20px;display:flex;align-items:center;justify-content:space-between}
.auth-logo{font-size:1.4rem;font-weight:900;color:var(--green);text-decoration:none}
.auth-main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-xl);padding:clamp(22px,5vw,38px);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.auth-top{text-align:center;margin-bottom:24px}
.auth-icon{font-size:3rem;margin-bottom:8px}
.auth-title{font-size:1.5rem;font-weight:900;margin-bottom:4px}
.auth-sub{font-size:.88rem;color:var(--muted);font-weight:600}
.auth-tab-row{display:flex;background:var(--surface2);border-radius:var(--radius);padding:4px;gap:3px;margin-bottom:20px}
.auth-tab{flex:1;padding:10px;text-align:center;font-weight:800;font-size:.9rem;border-radius:var(--radius-sm);color:var(--muted);cursor:pointer;transition:all .2s;border:none;background:none}
.auth-tab.active{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(88,204,2,.3)}
.form-group{margin-bottom:14px}
.input-wrap{position:relative}
.input-prefix{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1rem;pointer-events:none;color:var(--muted)}
.input.has-prefix{padding-left:40px}
.password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:4px}
.divider-or{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:.8rem;font-weight:700}
.divider-or::before,.divider-or::after{content:'';flex:1;height:1.5px;background:var(--border)}
.err-msg{color:var(--red);font-size:.85rem;font-weight:700;margin-top:10px;text-align:center;padding:10px;background:rgba(255,75,75,.08);border-radius:var(--radius-sm)}
.password-strength{display:flex;gap:4px;margin-top:6px}
.ps-bar{height:4px;border-radius:100px;flex:1;background:var(--border);transition:background .3s}
</style>
</head>
<body>
<div class="auth-bg"></div>

<div class="auth-page">
  <header class="auth-header">
    <a href="/" class="auth-logo">🦅 FinLingvo</a>
    <a href="/" class="btn btn-ghost btn-sm">← Башкы бет</a>
  </header>

  <main class="auth-main">
    <div class="auth-card animate-scaleIn">
      <div class="auth-top">
        <div class="auth-icon" id="auth-icon">🦅</div>
        <div class="auth-title" id="auth-title">Кош келиңиз!</div>
        <div class="auth-sub"  id="auth-sub">Email жана сырсөзүңүз менен кириңиз</div>
      </div>

      <div class="auth-tab-row">
        <button class="auth-tab active" id="tab-login"  onclick="switchTab('login')">Кирүү</button>
        <button class="auth-tab"        id="tab-signup" onclick="switchTab('signup')">Каттоо</button>
      </div>

      <form id="auth-form" onsubmit="handleSubmit(event)" novalidate>
        <!-- Name (signup only) -->
        <div class="form-group" id="name-group" style="display:none">
          <label class="label">Атыңыз</label>
          <div class="input-wrap">
            <span class="input-prefix">👤</span>
            <input class="input has-prefix" id="inp-name" type="text" placeholder="Аты-жөнүңүзду жазыңыз" autocomplete="name">
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="label">Email</label>
          <div class="input-wrap">
            <span class="input-prefix">📧</span>
            <input class="input has-prefix" id="inp-email" type="email" placeholder="email@example.com" autocomplete="email" required>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="label">Сырсөз</label>
          <div class="input-wrap">
            <span class="input-prefix">🔒</span>
            <input class="input has-prefix" id="inp-pass" type="password" placeholder="Сырсөзүңүздү жазыңыз" autocomplete="current-password" required>
            <button type="button" class="password-toggle" onclick="togglePass()">👁️</button>
          </div>
          <div class="password-strength" id="ps-strength" style="display:none">
            <div class="ps-bar" id="ps1"></div>
            <div class="ps-bar" id="ps2"></div>
            <div class="ps-bar" id="ps3"></div>
            <div class="ps-bar" id="ps4"></div>
          </div>
        </div>

        <div id="err-msg" class="err-msg" style="display:none"></div>

        <button type="submit" class="btn btn-green btn-full btn-lg" id="submit-btn" style="margin-top:8px">
          Кирүү
        </button>
      </form>

      <div class="divider-or">же</div>

      <button class="btn btn-surface btn-full" onclick="guestLogin()">
        👁️ Конок катары байкоо
      </button>

      <p style="text-align:center;font-size:.8rem;color:var(--muted);margin-top:16px;line-height:1.5">
        Каттоо менен сен платформанын <a href="#" style="color:var(--green)">колдонуу шарттарына</a> макул болосуң
      </p>
    </div>
  </main>
</div>

<script src="/js/data.js"></script>
<script src="/js/app.js"></script>
<script>
let mode = 'login';
const params = new URLSearchParams(location.search);
if (params.has('signup')) switchTab('signup');
if (params.has('guest'))  guestLogin();

function switchTab(tab) {
  mode = tab;
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
  document.getElementById('name-group').style.display = tab === 'signup' ? 'block' : 'none';
  document.getElementById('ps-strength').style.display = tab === 'signup' ? 'flex' : 'none';
  document.getElementById('auth-icon').textContent   = tab === 'signup' ? '🎉' : '🦅';
  document.getElementById('auth-title').textContent  = tab === 'signup' ? 'Аккаунт жасоо' : 'Кош келиңиз!';
  document.getElementById('auth-sub').textContent    = tab === 'signup' ? 'Акысыз каттал жана баштап кет' : 'Email жана сырсөзүңүз менен кириңиз';
  document.getElementById('submit-btn').textContent  = tab === 'signup' ? 'Каттоо' : 'Кирүү';
  document.getElementById('inp-pass').autocomplete   = tab === 'signup' ? 'new-password' : 'current-password';
  hideErr();
}

function showErr(msg) {
  const el = document.getElementById('err-msg');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideErr() {
  document.getElementById('err-msg').style.display = 'none';
}

document.getElementById('inp-pass').addEventListener('input', function() {
  if (mode !== 'signup') return;
  const v = this.value;
  const strength = [v.length >= 6, /[A-Z]/.test(v)||/[а-яА-Я]/.test(v), /[0-9]/.test(v), v.length >= 10];
  const colors = ['var(--red)','var(--orange)','var(--yellow)','var(--green)'];
  const count = strength.filter(Boolean).length;
  ['ps1','ps2','ps3','ps4'].forEach((id, i) => {
    document.getElementById(id).style.background = i < count ? colors[count-1] : 'var(--border)';
  });
});

function togglePass() {
  const inp = document.getElementById('inp-pass');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function handleSubmit(e) {
  e.preventDefault();
  hideErr();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-block;animation:spin 1s linear infinite">⏳</span>';

  const email = document.getElementById('inp-email').value.trim();
  const pass  = document.getElementById('inp-pass').value;
  const name  = document.getElementById('inp-name')?.value?.trim();

  try {
    if (mode === 'login') {
      await Store.login(email, pass);
    } else {
      if (!name) { showErr('Атыңызды жазыңыз'); btn.disabled=false; btn.textContent='Каттоо'; return; }
      if (pass.length < 6) { showErr('Сырсөз кеминде 6 символ болуш керек'); btn.disabled=false; btn.textContent='Каттоо'; return; }
      await Store.signup(name, email, pass);
    }
    window.location.href = '/learn.html';
  } catch(err) {
    showErr(err.message || 'Ката болду. Кайра аракет кыл.');
    btn.disabled = false;
    btn.textContent = mode === 'login' ? 'Кирүү' : 'Каттоо';
  }
}

async function guestLogin() {
  await Store.loginAsGuest();
  window.location.href = '/learn.html';
}
</script>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</body>
</html>

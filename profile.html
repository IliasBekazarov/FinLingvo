<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FinLingvo — Профиль</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div class="app-layout">

  <div class="mob-overlay" id="mob-overlay" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <a href="learn.html" class="sidebar-logo" style="text-decoration:none;">
      <div class="sidebar-logo-icon">🦅</div>
      <div><div class="sidebar-logo-title">FinLingo</div><div class="sidebar-logo-sub">Финансылык саббатулук оюну</div></div>
    </a>
    <nav style="flex:1;">
      <a href="learn.html"       class="nav-item"><span class="nav-icon">📚</span>Үйрөнүү</a>
      <a href="leaderboard.html" class="nav-item"><span class="nav-icon" style="font-size:0.95rem;">📊</span>Лига</a>
      <a href="shop.html"        class="nav-item"><span class="nav-icon">🛒</span>Дүкөн</a>
      <a href="profile.html"     class="nav-item active"><span class="nav-icon">👤</span>Профиль</a>
      <a href="settings.html"    class="nav-item"><span class="nav-icon">⚙️</span>Орнотуу</a>
    </nav>
    <div id="sidebar-user" style="padding:0.6rem;border-top:1px solid rgba(255,255,255,0.06);"></div>
  </aside>

  <div class="main-content">
    <div class="top-stats">
      <button class="hamburger" onclick="openSidebar()">☰</button>
      <div style="flex:1;"></div>
      <div class="stat-pill streak">🔥 <span id="stat-streak">0</span></div>
      <div class="stat-pill gems">💎 <span id="stat-gems">0</span></div>
      <div class="stat-pill hearts">❤️ <span id="stat-hearts">5</span></div>
    </div>

    <div class="page-wrap" style="max-width:680px;">

      <!-- Profile hero -->
      <div class="section-card" style="margin-bottom:1.2rem;">
        <div style="padding:1.6rem;display:flex;align-items:center;gap:1.2rem;border-bottom:1px solid rgba(255,255,255,0.06);">
          <div class="profile-avatar-area">
            <div class="profile-avatar" id="u-avatar">🦅</div>
            <div class="profile-lvl" id="u-lvl">LVL 1</div>
          </div>
          <div style="flex:1;">
            <h2 style="font-size:1.4rem;font-weight:900;margin-bottom:0.2rem;" id="u-name">—</h2>
            <div style="font-size:0.82rem;font-weight:600;color:#7a859e;margin-bottom:0.7rem;" id="u-league">—</div>
            <div class="xp-bar">
              <div class="xp-fill" id="xp-fill" style="width:0%;"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:0.7rem;font-weight:700;color:#3d4860;margin-top:4px;">
              <span id="xp-cur">0 XP</span>
              <span id="xp-nxt">→ Деңгээл 2</span>
            </div>
          </div>
        </div>
        <div style="padding:1rem;">
          <div class="stats-grid">
            <div class="stat-card">
              <span class="stat-card-ico">⭐</span>
              <div><div class="stat-val gradient-gold" id="p-xp">0</div><div class="stat-lbl">Жалпы XP</div></div>
            </div>
            <div class="stat-card">
              <span class="stat-card-ico">🔥</span>
              <div><div class="stat-val" style="color:#FF9600;" id="p-streak">0</div><div class="stat-lbl">Streak</div></div>
            </div>
            <div class="stat-card">
              <span class="stat-card-ico">💎</span>
              <div><div class="stat-val gradient-blue" id="p-gems">0</div><div class="stat-lbl">Gems</div></div>
            </div>
            <div class="stat-card">
              <span class="stat-card-ico">✅</span>
              <div><div class="stat-val gradient-green" id="p-lessons">0</div><div class="stat-lbl">Сабактар</div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Module progress -->
      <div class="section-card" style="margin-bottom:1.2rem;">
        <div class="section-card-hdr">📈 Бөлүм Прогресси</div>
        <div style="padding:1rem;display:flex;flex-direction:column;gap:0.9rem;" id="mod-progress"></div>
      </div>

      <!-- Achievements -->
      <div class="section-card" style="margin-bottom:1.2rem;">
        <div class="section-card-hdr">🏅 Жетишкендиктер</div>
        <div style="padding:1rem;">
          <div class="ach-grid" id="ach-grid"></div>
        </div>
      </div>

      <!-- Logout -->
      <button onclick="if(confirm('Чыккыңыз келеби?'))AUTH.logout()" style="display:block;width:100%;padding:0.95rem;background:rgba(255,75,75,0.06);border:1.5px solid rgba(255,75,75,0.3);color:#FF4B4B;font-weight:900;font-size:0.85rem;letter-spacing:1px;border-radius:14px;cursor:pointer;font-family:'Nunito',sans-serif;transition:all 0.2s;" onmouseover="this.style.background='rgba(255,75,75,0.12)'" onmouseout="this.style.background='rgba(255,75,75,0.06)'">
        🚪 ЧЫГУУ
      </button>
    </div>
  </div>

  <nav class="mobile-nav">
    <div class="mob-nav-items">
      <a href="learn.html"       class="mob-nav-item"><span class="ico">📚</span>Үйрөнүү</a>
      <a href="leaderboard.html" class="mob-nav-item"><span class="ico">🏆</span>Лига</a>
      <a href="shop.html"        class="mob-nav-item"><span class="ico">🛒</span>Дүкөн</a>
      <a href="profile.html"     class="mob-nav-item active"><span class="ico">👤</span>Профиль</a>
    </div>
  </nav>

</div>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  if (!AUTH.isLoggedIn()) window.location.href = 'index.html';
  const user = AUTH.getUser();
  APP.updateHeaderStats();

  function sidebarUser() {
    const u = AUTH.getUser(), league = LEAGUES.find(l => l.id === u.league) || LEAGUES[0];
    document.getElementById('sidebar-user').innerHTML = `
      <div style="display:flex;align-items:center;gap:0.65rem;padding:0.5rem;">
        <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#162240,#0b1628);display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:2px solid rgba(28,176,246,0.3);flex-shrink:0;">${u.avatar||'🦅'}</div>
        <div><div style="font-weight:800;font-size:0.85rem;">${u.name}</div><div style="font-size:0.65rem;color:#7a859e;">${league.icon} ${league.name} · ${u.xp} XP</div></div>
      </div>`;
  }
  sidebarUser();

  function openSidebar()  { document.getElementById('sidebar').classList.add('open'); document.getElementById('mob-overlay').classList.add('show'); }
  function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('mob-overlay').classList.remove('show'); }

  function render() {
    const u = AUTH.getUser();
    const lvl = AUTH.calculateLevel(u.xp);
    const nextXP = Math.pow(lvl, 2) * 100;
    const prevXP = Math.pow(lvl - 1, 2) * 100;
    const pct = Math.min(((u.xp - prevXP) / (nextXP - prevXP)) * 100, 100);
    const league = LEAGUES.find(l => l.id === u.league) || LEAGUES[0];

    document.getElementById('u-avatar').textContent = u.avatar || '🦅';
    document.getElementById('u-name').textContent = u.name;
    document.getElementById('u-lvl').textContent = `LVL ${lvl}`;
    document.getElementById('u-league').textContent = `${league.icon} ${league.name} Лигасы · Деңгээл ${lvl}`;
    document.getElementById('xp-fill').style.width = pct + '%';
    document.getElementById('xp-cur').textContent = `${u.xp.toLocaleString()} XP`;
    document.getElementById('xp-nxt').textContent = `→ Деңгээл ${lvl + 1}: ${nextXP.toLocaleString()} XP`;
    document.getElementById('p-xp').textContent = u.xp.toLocaleString();
    document.getElementById('p-streak').textContent = u.streak;
    document.getElementById('p-gems').textContent = u.gems;
    const done = Object.values(u.progress || {}).filter(p => p.completed).length;
    document.getElementById('p-lessons').textContent = done;

    // Module progress
    const ml = document.getElementById('mod-progress');
    ml.innerHTML = MODULES.map(m => {
      const p = APP.calculateModuleProgress(m.id);
      return `<div style="display:flex;align-items:center;gap:0.75rem;">
        <span style="font-size:1.3rem;flex-shrink:0;">${m.emoji}</span>
        <div style="flex:1;">
          <div style="font-size:0.82rem;font-weight:700;margin-bottom:3px;">${m.title}</div>
          <div class="xp-bar"><div class="xp-fill" style="width:${p.pct}%;background:${m.color};"></div></div>
        </div>
        <span style="font-size:0.72rem;font-weight:900;color:${m.color};flex-shrink:0;">${p.completed}/${p.total}</span>
      </div>`;
    }).join('');

    // Achievements
    document.getElementById('ach-grid').innerHTML = ACHIEVEMENTS.map(a => {
      const earned = u.achievements?.includes(a.id);
      return `<div class="ach-item ${earned ? 'earned' : 'locked'}" title="${a.description}">
        <span class="ach-ico">${a.icon}</span>
        <span class="ach-name">${a.title}</span>
      </div>`;
    }).join('');
  }

  render();
</script>
</body>
</html>
